# Lints and tests the Rust API, then (on main) publishes its Docker image to
# GHCR. The VPS never builds: deploy/coolify-watch.sh there redeploys when
# :latest changes.
name: API

on:
  push:
    branches: [main]
    paths: ["apps/api/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/api.yml"]
  pull_request:
    paths: ["apps/api/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/api.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tutor-api:latest
            ghcr.io/${{ github.repository_owner }}/tutor-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Tutor API
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
